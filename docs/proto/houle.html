<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototype — la houle (Souffle court)</title>
  <!-- Essai isolé du jeu : le temps d'une tuile se lit sur une VRAIE vague. Une houle naît au large, épouse la forme
       de la côte en approchant, grossit dans les hauts-fonds et déferle sur le rivage quand le temps est écoulé.
       Poser une tuile la repousse au large. Rien de dessiné par le code : l'écume, ce sont les vagues du jeu
       (sea_wave_1..3) et les gouttes (drop) ; le creux et la face de la vague sont des bandes en dégradé. -->
  <style>
    html, body { margin: 0; height: 100%; background: #5a9bc4; font-family: Quicksand, system-ui, sans-serif; color: #2b2a26; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .panneau { position: fixed; left: 12px; top: 12px; background: rgba(251,247,238,0.94); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6; box-shadow: 0 6px 18px rgba(30,50,70,0.15); max-width: 300px; }
    .panneau label { display: block; } .panneau input[type=range] { width: 110px; vertical-align: middle; }
    .panneau button { font: inherit; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(43,42,38,0.2); background: #2f9e8f; color: #fff; cursor: pointer; margin-top: 6px; }
    .panneau details { margin-top: 4px; } .panneau summary { cursor: pointer; }
    .compte { position: fixed; right: 16px; top: 12px; font-size: 40px; font-weight: 700; background: rgba(251,247,238,0.9); border-radius: 12px; padding: 4px 16px; font-variant-numeric: tabular-nums; }
    .compte.urgent { color: #d95f4b; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="panneau">
    <b>La houle</b> — une vague vient du large et déferle sur la côte en <span id="lblDuree">3,0</span> s ; quand elle touche le rivage, la tuile est perdue. Poser une tuile la repousse.<br>
    <label>Durée <input id="duree" type="range" min="1.5" max="6" step="0.1" value="3"></label>
    <label>Saison <select id="saison"><option value="spring">Printemps</option><option value="summer" selected>Été</option><option value="autumn">Automne</option><option value="winter">Hiver (×1,4)</option></select></label>
    <details><summary>Réglages fins</summary>
      <label>Départ au large <input id="large" type="range" min="100" max="320" step="10" value="210"></label>
      <label>Hauteur de la vague <input id="hauteur" type="range" min="16" max="80" step="2" value="40"></label>
      <label>Écume <input id="ecume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label><input id="creux" type="checkbox" checked> Creux sombre derrière la crête</label>
      <label><input id="face" type="checkbox" checked> Face claire devant la crête</label>
      <label><input id="battement" type="checkbox" checked> L'écume respire sur la musique (143 BPM)</label>
      <label><input id="deferle" type="checkbox" checked> Déferlement et embruns à la fin</label>
      <label><input id="fond" type="checkbox" checked> Vagues de fond comme dans le jeu</label>
    </details>
    <button id="poser">Poser (repousser)</button> <button id="perdre" style="background:#d95f4b">Laisser filer</button>
  </div>
  <div class="compte" id="compte">3.0</div>
<script type="module">
import { toWorld, corners, SIZE } from '../../src/game/hex.js';
const SEA = { spring: ['#8fc8e6', '#5f9fc8'], summer: ['#7fc0e4', '#4f93c2'], autumn: ['#8cb9d3', '#5d8fb3'], winter: ['#a9c7db', '#7aa2bf'] };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = Math.min(2, devicePixelRatio || 1);
function taille() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
taille(); addEventListener('resize', taille);
const ui = (id) => document.getElementById(id);

// --- l'île : un masque à la main, huit tuiles posées, le reste libre
const MASK = [[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1],[2,1],[-2,2],[-1,2],[0,2],[1,2],[-2,3],[-1,3],[0,3],[1,-1],[2,-1],[0,-1],[3,-1],[3,0],[-1,0],[-2,1],[2,2],[-3,3],[1,3]];
const TUILES = { '0,0': 'hamlet_1', '1,0': 'meadow_1', '0,1': 'water_1', '1,1': 'forest_1', '-1,1': 'field_1', '2,0': 'orchard_1', '0,2': 'meadow_1', '1,-1': 'rock_1' };
const manifest = await (await fetch('../../assets/img/manifest.json')).json();
const img = (k) => { const e = manifest.images[k]; const i = new Image(); i.src = `../../assets/img/${e.file}`; return i; };
const sprites = {}; for (const k of Object.values(TUILES)) sprites[k] = img(`${k}_summer`);
const VAGUES = ['sea_wave_1', 'sea_wave_2', 'sea_wave_3'].map(img);
const GOUTTE = img('drop');
// la vague du pack finit par une ligne opaque : on fond son bas en dégradé, comme `vagueFondue` dans le jeu
const fondues = new Map();
function fondue(im) { if (!im.complete || !im.naturalWidth) return null; const hit = fondues.get(im); if (hit) return hit;
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.5, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.globalCompositeOperation = 'destination-in'; x.fillStyle = g; x.fillRect(0, 0, c.width, c.height); fondues.set(im, c); return c; }

let cx = 0, cy = 0; for (const [q, r] of MASK) { const w = toWorld(q, r); cx += w.x / MASK.length; cy += w.y / MASK.length; }
const zoom = () => Math.min(innerWidth / 1100, innerHeight / 760) * 0.62;
const ecran = (x, y) => { const z = zoom(); return { x: innerWidth / 2 + (x - cx) * z, y: innerHeight / 2 + 20 + (y - cy) * z }; };

// --- la côte : les arêtes des hexagones qui ne donnent sur aucun autre, chaînées en boucle, puis adoucies (Chaikin)
const cle = (p) => `${Math.round(p[0])},${Math.round(p[1])}`;
const compte = new Map(), aretes = [];
for (const [q, r] of MASK) { const w = toWorld(q, r); const pts = corners(w.x, w.y, SIZE); for (let i = 0; i < 6; i++) { const a = pts[i], b = pts[(i + 1) % 6]; const k = [cle(a), cle(b)].sort().join('|'); compte.set(k, (compte.get(k) || 0) + 1); aretes.push({ a, b, k }); } }
const bord = aretes.filter((e) => compte.get(e.k) === 1);
const depuis = new Map(); for (const e of bord) depuis.set(cle(e.a), e);
let boucle = []; let cur = bord[0]; const vus = new Set();
while (cur && !vus.has(cur.k)) { vus.add(cur.k); boucle.push(cur.a); cur = depuis.get(cle(cur.b)); }
for (let it = 0; it < 2; it++) { const out = []; for (let i = 0; i < boucle.length; i++) { const a = boucle[i], b = boucle[(i + 1) % boucle.length]; out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); } boucle = out; }
// chaque point de côte : sa direction et sa distance au centre ; la vague garde la forme de la côte près du rivage et s'arrondit au large
const cote = boucle.map(([x, y]) => { const r = Math.hypot(x - cx, y - cy); return { ux: (x - cx) / r, uy: (y - cy) / r, r }; });
const Rm = cote.reduce((s, p) => s + p.r, 0) / cote.length;
function crete(d) { const k = Math.min(0.85, Math.max(0, d / (Rm * 1.2))); return cote.map((p) => { const rr = (p.r + 8 + d) * (1 - k) + (Rm + 8 + d) * k; return ecran(cx + p.ux * rr, cy + p.uy * rr); }); }
function trace(pts) { ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); }
// une bande entre deux crêtes, remplie (règle pair-impair) : le creux, la face, la lèvre
function anneau(d1, d2, style) { ctx.beginPath(); trace(crete(Math.max(0, d1))); trace(crete(Math.max(0, d2))); ctx.fillStyle = style; ctx.fill('evenodd'); }
// des points régulièrement espacés le long d'une crête (en pixels d'écran), pour y poser l'écume
function echantillons(pts, pas, decal = 0) { const out = []; let acc = decal; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; const L = Math.hypot(b.x - a.x, b.y - a.y); let s = acc; while (s < L) { const t = s / L; out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, i: out.length }); s += pas; } acc = s - L; } return out; }

// --- les vagues de fond, comme `drawSea` : une couronne de vagues qui ondulent, serrées près du rivage
const rnd = (a, b) => a + Math.random() * (b - a);
const fond = []; for (let i = 0; i < 44; i++) { const a = rnd(0, Math.PI * 2), r = Rm + 20 + Math.pow(Math.random(), 0.6) * 420; fond.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, t: rnd(0, 10), s: rnd(0.75, 1.25), ph: rnd(0, Math.PI * 2) }); }

// --- le temps
let duree = 3, t = 3, perdue = 0, depart = performance.now(), naissance = 0, mourante = null, embruns = [];
const facteur = () => (ui('saison').value === 'winter' ? 1.4 : 1);
function armer(repousse = true) {
  if (repousse && perdue <= 0 && t < duree) mourante = { d: distance(t / duree), a: 1 };   // la vague en cours est repoussée au large et s'efface
  duree = Number(ui('duree').value) * facteur(); t = duree; naissance = 0; ui('lblDuree').textContent = duree.toFixed(1).replace('.', ',');
}
const distance = (f) => Number(ui('large').value) * Math.pow(f, 0.9);   // la vague ralentit un peu dans les hauts-fonds
ui('poser').onclick = () => armer(); ui('duree').oninput = () => armer(false); ui('saison').onchange = () => armer(false); ui('perdre').onclick = () => { t = 0.05; };
addEventListener('keydown', (e) => { if (e.code === 'Space') armer(); });
armer(false);
function deferler() {   // la vague se brise sur la côte : gouttes d'embruns qui jaillissent du rivage
  if (!ui('deferle').checked) return;
  const pts = echantillons(crete(0), 26 * zoom());
  for (const p of pts) { const n = 2 + (Math.random() < 0.5 ? 1 : 0); for (let i = 0; i < n; i++) { const dx = p.x - innerWidth / 2, dy = p.y - (innerHeight / 2 + 20); const L = Math.hypot(dx, dy) || 1;
    embruns.push({ x: p.x, y: p.y, vx: (dx / L) * rnd(20, 90) * zoom() + rnd(-30, 30), vy: -rnd(120, 260) * zoom(), age: 0, vie: rnd(0.5, 0.9), s: rnd(0.6, 1.1) }); } }
}

let dernier = performance.now();
function boucleAnim(now) {
  const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
  if (perdue > 0) perdue -= dt; else { t -= dt; if (t <= 0) { perdue = 0.8; t = 0; deferler(); setTimeout(() => armer(false), 850); } }
  naissance = Math.min(1, naissance + dt / 0.4);
  const f = duree > 0 ? Math.max(0, t / duree) : 0;
  const urgent = t <= 1 && perdue <= 0;
  const bpm = 143, temps = 60 / bpm; const phase = ((now - depart) / 1000 % temps) / temps; const puls = ui('battement').checked ? Math.pow(1 - phase, 3) : 0;
  const saison = ui('saison').value, hiver = saison === 'winter';
  const z = zoom();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  // la mer et sa profondeur, comme dans le jeu
  const g0 = ctx.createLinearGradient(0, 0, 0, cv.height); g0.addColorStop(0, SEA[saison][0]); g0.addColorStop(1, SEA[saison][1]); ctx.fillStyle = g0; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  { const c = ecran(cx, cy); const r0 = (Rm + 30) * z; const rg = ctx.createRadialGradient(c.x, c.y, r0 * 1.05, c.x, c.y, r0 * 3); rg.addColorStop(0, 'rgba(16,48,92,0)'); rg.addColorStop(1, 'rgba(16,48,92,0.30)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, innerWidth, innerHeight); }
  if (ui('fond').checked) { ctx.save(); let i = 0; for (const w of fond) { if (hiver && (++i & 1)) continue; w.t += dt; const p = ecran(w.x + Math.sin(w.t * 0.5) * 12, w.y + Math.sin(w.t * 0.35 + w.ph) * 4); const ww = 74 * w.s * z, hh = ww / 3.6; const im = fondue(VAGUES[Math.floor(w.t * 0.7) % 3]); if (!im) continue; ctx.globalAlpha = Math.max(0.05, Math.min(0.85, (hiver ? 0.22 : 0.44) + (hiver ? 0.12 : 0.24) * Math.sin(w.t * 1.3 + w.ph))); ctx.drawImage(im, p.x - ww / 2, p.y - hh / 2, ww, hh); } ctx.restore(); }

  // --- la houle
  const H = Number(ui('hauteur').value), ecumeMax = Number(ui('ecume').value);
  function vague(d, alpha, f, tps) {   // d : distance à la côte (unités monde) ; f : ce qui reste (0..1) ; la vague grossit en approchant
    const h = H * (0.6 + 0.7 * (1 - f));
    ctx.save(); ctx.globalAlpha = alpha;
    if (ui('creux').checked) { anneau(d + h * 0.25, d + h * 1.6, 'rgba(16,48,92,0.10)'); anneau(d + h * 0.4, d + h * 1.0, 'rgba(16,48,92,0.12)'); }
    if (ui('face').checked) { anneau(d - h * 0.9, d, 'rgba(255,255,255,0.10)'); anneau(d - h * 0.45, d, 'rgba(255,255,255,0.13)'); }
    anneau(d - h * 0.12, d + h * 0.12, `rgba(225,242,255,${(0.22 + 0.25 * (1 - f)).toFixed(3)})`);   // la lèvre : le haut de la vague qui prend la lumière
    // l'écume de la crête : les vagues du jeu, serrées, qui respirent ; plus blanches et plus grosses près du rivage
    // deux rangs d'écume décalés, pour une crête continue et mousseuse
    const a = ecumeMax * (hiver ? 0.55 : 1) * (0.45 + 0.55 * (1 - f)) + 0.25 * puls;
    for (let rang = 0; rang < 2; rang++) { const pas = 22 * z; const pts = echantillons(crete(d + (rang ? h * 0.1 : -h * 0.05)), pas, ((tps * 14) + rang * pas * 0.5) % pas);
      for (const p of pts) { const im = fondue(VAGUES[(p.i + rang + Math.max(0, Math.floor(tps * 0.7))) % 3]); if (!im) continue; const sc = (0.6 + 0.7 * (1 - f) + 0.15 * puls) * (0.85 + 0.3 * Math.sin(p.i * 1.7 + rang + tps * 2.2)); const ww = 74 * sc * z, hh = ww / 3.6; ctx.globalAlpha = Math.min(1, alpha * Math.min(1, a * (0.8 + 0.4 * Math.sin(p.i * 2.3 + rang * 2 + tps * 3)))); ctx.drawImage(im, p.x - ww / 2, p.y - hh / 2 + Math.sin(tps * 3 + p.i + rang) * 2 * z, ww, hh); } }
    ctx.restore();
  }
  const tps = Math.max(0, (now - depart) / 1000);
  if (mourante) { mourante.a -= dt / 0.45; mourante.d += dt * 160; if (mourante.a <= 0) mourante = null; else vague(mourante.d, mourante.a * 0.8, 0.6, tps); }
  if (perdue <= 0) vague(distance(f), naissance, f, tps);
  // le déferlement : la côte blanchit d'écume qui s'étale et s'efface, les embruns retombent
  // la côte blanchit d'un coup, l'écume s'étale vers le large en s'effaçant (la vague qui reflue), les embruns retombent
  if (perdue > 0) { const k = perdue / 0.8, e = 1 - k; ctx.save();
    anneau(0, H * (0.6 + 1.2 * e), `rgba(255,255,255,${(0.6 * k).toFixed(3)})`); anneau(0, H * (1.2 + 2.2 * e), `rgba(255,255,255,${(0.3 * k).toFixed(3)})`);
    for (let rang = 0; rang < 3; rang++) { const pts = echantillons(crete(H * (0.15 + 0.35 * rang) * (0.4 + 1.6 * e)), 18 * z, rang * 6 * z); for (const p of pts) { const im = fondue(VAGUES[(p.i + rang) % 3]); if (!im) continue; const ww = 74 * (1.0 + 0.5 * e) * (0.85 + 0.3 * Math.sin(p.i * 1.7 + rang)) * z, hh = ww / 3.6; ctx.globalAlpha = Math.min(1, 1.1 * k); ctx.drawImage(im, p.x - ww / 2, p.y - hh / 2, ww, hh); } }
    ctx.restore(); }
  for (const e of embruns) { e.age += dt; e.vy += 700 * z * dt; e.x += e.vx * dt; e.y += e.vy * dt; }
  embruns = embruns.filter((e) => e.age < e.vie);
  if (embruns.length && GOUTTE.complete && GOUTTE.naturalWidth) { ctx.save(); for (const e of embruns) { const k = 1 - e.age / e.vie; ctx.globalAlpha = 0.9 * Math.min(1, k * 1.5); const w = 13 * e.s * z, h = 26 * e.s * z; ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx) + Math.PI / 2); ctx.drawImage(GOUTTE, -w / 2, -h / 2, w, h); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); } ctx.restore(); }

  // les cases libres puis les tuiles
  for (const [q, r] of MASK) { const w = toWorld(q, r); const c = ecran(w.x, w.y); const k = `${q},${r}`;
    if (!TUILES[k]) { const pts = corners(c.x, c.y, SIZE * z * 0.98); ctx.fillStyle = 'rgba(236,244,250,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 6; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); ctx.stroke(); } }
  for (const [q, r] of MASK) { const k = `${q},${r}`; if (!TUILES[k]) continue; const w = toWorld(q, r); const c = ecran(w.x, w.y); const im = sprites[TUILES[k]]; if (im.complete && im.naturalWidth) { const tw = 120 * z, th = 140 * z; ctx.drawImage(im, c.x - tw / 2, c.y - th / 2, tw, th); } }
  const el = ui('compte'); el.textContent = t.toFixed(1); el.classList.toggle('urgent', urgent);
  requestAnimationFrame(boucleAnim);
}
requestAnimationFrame(boucleAnim);
</script>
</body>
</html>
