<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototype — la mèche autour de l'île (Souffle court)</title>
  <!-- Essai isolé du jeu : une île de tuiles réelles, et le temps d'une tuile lu sur une étincelle qui fait le tour de la côte.
       Rien de dessiné par le code : les tuiles et l'étincelle sont les images du jeu ; la traînée et le halo sont des dégradés. -->
  <style>
    html, body { margin: 0; height: 100%; background: #5a9bc4; font-family: Quicksand, system-ui, sans-serif; color: #2b2a26; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .panneau { position: fixed; left: 12px; top: 12px; background: rgba(251,247,238,0.94); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6; box-shadow: 0 6px 18px rgba(30,50,70,0.15); max-width: 300px; }
    .panneau label { display: block; } .panneau input[type=range] { width: 120px; vertical-align: middle; }
    .panneau button { font: inherit; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(43,42,38,0.2); background: #2f9e8f; color: #fff; cursor: pointer; margin-top: 6px; }
    .compte { position: fixed; right: 16px; top: 12px; font-size: 40px; font-weight: 700; background: rgba(251,247,238,0.9); border-radius: 12px; padding: 4px 16px; font-variant-numeric: tabular-nums; }
    .compte.urgent { color: #d95f4b; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="panneau">
    <b>La mèche</b> — l'étincelle fait le tour de l'île en <span id="lblDuree">3,0</span> s ; à la fin du tour, la tuile est perdue.<br>
    <label>Durée <input id="duree" type="range" min="1.5" max="6" step="0.1" value="3"></label>
    <label>Saison <select id="saison"><option value="spring">Printemps</option><option value="summer" selected>Été</option><option value="autumn">Automne</option><option value="winter">Hiver (×1,4)</option></select></label>
    <label>Couleur <select id="couleur"><option value="feu" selected>Feu (or → rouge)</option><option value="saison">Couleur de la saison</option></select></label>
    <label>Taille de l'étincelle <input id="taille" type="range" min="30" max="110" step="5" value="64"></label>
    <label><input id="trainee" type="checkbox" checked> Traînée qui s'éteint</label>
    <label><input id="halo" type="checkbox" checked> Halo de côte derrière la mèche</label>
    <label><input id="battement" type="checkbox" checked> Battement sur la musique (143 BPM)</label>
    <label><input id="brulee" type="checkbox" checked> La côte déjà parcourue reste « brûlée »</label>
    <button id="poser">Poser (réarmer)</button> <button id="perdre" style="background:#d95f4b">Laisser filer</button>
  </div>
  <div class="compte" id="compte">3.0</div>
<script type="module">
import { toWorld, corners, SIZE, DIRS } from '../../src/game/hex.js';
const SAISON_COL = { spring: [109,191,103], summer: [74,158,79], autumn: [217,138,58], winter: [159,184,204] };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = Math.min(2, devicePixelRatio || 1);
function taille() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
taille(); addEventListener('resize', taille);

// --- l'île : un masque à la main, huit tuiles posées, le reste libre
const MASK = [[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1],[2,1],[-2,2],[-1,2],[0,2],[1,2],[-2,3],[-1,3],[0,3],[1,-1],[2,-1],[0,-1],[3,-1],[3,0],[-1,0],[-2,1],[2,2],[-3,3],[1,3]];
const TUILES = { '0,0': 'hamlet_1', '1,0': 'meadow_1', '0,1': 'water_1', '1,1': 'forest_1', '-1,1': 'field_1', '2,0': 'orchard_1', '0,2': 'meadow_1', '1,-1': 'rock_1' };
const manifest = await (await fetch('../../assets/img/manifest.json')).json();
const img = (k) => { const e = manifest.images[k]; const i = new Image(); i.src = `../../assets/img/${e.file}`; return i; };
const sprites = {}; for (const k of Object.values(TUILES)) sprites[k] = img(`${k}_summer`);
const ETINCELLE = ['star_01', 'star_02', 'spark_01'].map(img);
// teinte un sprite blanc : on le copie dans un petit canvas et on remplit sa silhouette de la couleur voulue
const tcv = document.createElement('canvas'); tcv.width = tcv.height = 128; const tctx = tcv.getContext('2d');
function teinte(im, r, g, b) { tctx.clearRect(0, 0, 128, 128); tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(im, 0, 0, 128, 128); tctx.globalCompositeOperation = 'source-atop'; tctx.fillStyle = `rgba(${r},${g},${b},0.75)`; tctx.fillRect(0, 0, 128, 128); return tcv; }
// le centre et l'échelle : l'île tient au milieu de l'écran
let cx = 0, cy = 0; for (const [q, r] of MASK) { const w = toWorld(q, r); cx += w.x / MASK.length; cy += w.y / MASK.length; }
const zoom = () => Math.min(innerWidth / 1100, innerHeight / 760) * 0.62;
const ecran = (x, y) => { const z = zoom(); return { x: innerWidth / 2 + (x - cx) * z, y: innerHeight / 2 + 20 + (y - cy) * z }; };

// --- la côte : les bords des hexagones du masque qui ne donnent sur aucun autre hexagone, chaînés en une boucle
const cle = (p) => `${Math.round(p[0])},${Math.round(p[1])}`;
const compte = new Map(), aretes = [];
for (const [q, r] of MASK) { const w = toWorld(q, r); const pts = corners(w.x, w.y, SIZE); for (let i = 0; i < 6; i++) { const a = pts[i], b = pts[(i + 1) % 6]; const k = [cle(a), cle(b)].sort().join('|'); compte.set(k, (compte.get(k) || 0) + 1); aretes.push({ a, b, k }); } }
const bord = aretes.filter((e) => compte.get(e.k) === 1);
const depuis = new Map(); for (const e of bord) depuis.set(cle(e.a), e);
const boucle = []; let cur = bord[0]; const vus = new Set();
while (cur && !vus.has(cur.k)) { vus.add(cur.k); boucle.push(cur.a); cur = depuis.get(cle(cur.b)); }
// la mèche court un peu au large de la côte : chaque point repoussé depuis le centre
const LARGE = 1.06;
const chemin = boucle.map(([x, y]) => [cx + (x - cx) * LARGE, cy + (y - cy) * LARGE]);
const longueurs = [0]; for (let i = 1; i <= chemin.length; i++) { const a = chemin[i - 1], b = chemin[i % chemin.length]; longueurs.push(longueurs[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
const total = longueurs[chemin.length];
function pointA(f) { const d = ((f % 1) + 1) % 1 * total; let i = 0; while (i < chemin.length - 1 && longueurs[i + 1] < d) i++; const a = chemin[i], b = chemin[(i + 1) % chemin.length]; const t = (d - longueurs[i]) / (longueurs[i + 1] - longueurs[i] || 1); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

// --- le temps
const ui = (id) => document.getElementById(id);
let duree = 3, t = 3, perdue = 0, depart = performance.now(), traine = [];
const facteur = () => (ui('saison').value === 'winter' ? 1.4 : 1);
function armer() { duree = Number(ui('duree').value) * facteur(); t = duree; traine = []; ui('lblDuree').textContent = duree.toFixed(1).replace('.', ','); }
ui('poser').onclick = armer; ui('duree').oninput = armer; ui('saison').onchange = armer; ui('perdre').onclick = () => { t = 0.05; };
addEventListener('keydown', (e) => { if (e.code === 'Space') armer(); });
armer();

let dernier = performance.now();
function boucleAnim(now) {
  const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
  if (perdue > 0) perdue -= dt; else { t -= dt; if (t <= 0) { perdue = 0.6; t = 0; setTimeout(armer, 650); } }
  const f = duree > 0 ? Math.max(0, t / duree) : 0;   // ce qui reste, 0..1
  const avance = 1 - f;                                 // la fraction du tour parcourue
  const urgent = t <= 1 && perdue <= 0;
  const bpm = 143, temps = 60 / bpm; const phase = ((now - depart) / 1000 % temps) / temps; const puls = ui('battement').checked ? Math.pow(1 - phase, 3) : 0;
  const [cr, cg, cb] = urgent ? [217, 95, 75] : (ui('couleur').value === 'feu' ? [255, 190, 70] : SAISON_COL[ui('saison').value]);
  const base = Number(ui('taille').value);
  const z = zoom() * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  // la mer
  const g0 = ctx.createLinearGradient(0, 0, 0, cv.height); g0.addColorStop(0, '#7db8dc'); g0.addColorStop(1, '#4a8bb4'); ctx.fillStyle = g0; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // les cases libres puis les tuiles
  for (const [q, r] of MASK) { const w = toWorld(q, r); const c = ecran(w.x, w.y); const k = `${q},${r}`;
    if (!TUILES[k]) { const pts = corners(c.x, c.y, SIZE * zoom() * 0.98); ctx.fillStyle = 'rgba(236,244,250,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 6; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  }
  for (const [q, r] of MASK) { const k = `${q},${r}`; if (!TUILES[k]) continue; const w = toWorld(q, r); const c = ecran(w.x, w.y); const im = sprites[TUILES[k]]; if (im.complete && im.naturalWidth) { const tw = 120 * zoom(), th = 140 * zoom(); ctx.drawImage(im, c.x - tw / 2, c.y - th / 2, tw, th); } }
  // la tuile perdue : la côte s'allume en rouge et s'éteint
  if (perdue > 0) { ctx.save(); ctx.globalAlpha = perdue / 0.6 * 0.6; ctx.strokeStyle = 'rgb(217,95,75)'; ctx.lineWidth = 10 * zoom(); ctx.lineJoin = 'round'; ctx.beginPath(); chemin.forEach(([x, y], i) => { const c = ecran(x, y); if (i) ctx.lineTo(c.x, c.y); else ctx.moveTo(c.x, c.y); }); ctx.closePath(); ctx.stroke(); ctx.restore(); }
  // le halo de côte : ce qui reste à parcourir, en pointillé lumineux discret ; ce qui est parcouru, « brûlé »
  if (ui('halo').checked || ui('brulee').checked) {
    const n = 90; ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) { const fa = i / n, fb = (i + 0.6) / n; const a = pointA(fa), b = pointA(fb); const pa = ecran(a[0], a[1]), pb = ecran(b[0], b[1]);
      const fait = fa < avance;
      if (fait && !ui('brulee').checked) continue; if (!fait && !ui('halo').checked) continue;
      ctx.strokeStyle = fait ? 'rgba(43,42,38,0.28)' : `rgba(${cr},${cg},${cb},${(0.45 + 0.2 * puls).toFixed(3)})`; ctx.lineWidth = (fait ? 2.5 : 5) * zoom();
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke(); }
    ctx.restore();
  }
  // la traînée : les positions récentes, des ronds de lumière qui s'éteignent
  const tete = pointA(avance); const pt = ecran(tete[0], tete[1]);
  if (perdue <= 0) traine.push({ x: pt.x, y: pt.y, age: 0 });
  for (const p of traine) p.age += dt; traine = traine.filter((p) => p.age < 0.9);
  if (ui('trainee').checked) {
    for (const p of traine) { const k = 1 - p.age / 0.9; const r = (base * 0.12 + base * 0.22 * k) * zoom(); const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, `rgba(255,236,180,${(0.65 * k).toFixed(3)})`); g.addColorStop(0.45, `rgba(${cr},${cg},${cb},${(0.45 * k).toFixed(3)})`); g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); } }
  // l'étincelle : un sprite du jeu teinté à la couleur du feu, qui tourne, gonfle sur le temps et rougit à la fin ; un cœur de lumière dessous
  if (perdue <= 0) { const im = ETINCELLE[urgent ? 2 : 0]; const s = (base + base * 0.4 * puls + (urgent ? base * 0.3 : 0)) * zoom();
    const gl = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, s * 0.9); gl.addColorStop(0, 'rgba(255,244,205,0.9)'); gl.addColorStop(0.4, `rgba(${cr},${cg},${cb},0.7)`); gl.addColorStop(1, `rgba(${cr},${cg},${cb},0)`); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(pt.x, pt.y, s * 0.9, 0, Math.PI * 2); ctx.fill();
    if (im.complete && im.naturalWidth) { const tc = teinte(im, cr, cg, cb); ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(now / 400); ctx.drawImage(tc, -s / 2, -s / 2, s, s); ctx.restore(); } }
  const el = ui('compte'); el.textContent = t.toFixed(1); el.classList.toggle('urgent', urgent);
  requestAnimationFrame(boucleAnim);
}
requestAnimationFrame(boucleAnim);
</script>
</body>
</html>
