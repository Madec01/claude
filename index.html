<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cent Saisons">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/ui/app_icon_192.png">
  <title>Cent Saisons — L’île qui se souvient</title>
  <meta name="description" content="Cent Saisons : un puzzle contemplatif de tuiles hexagonales. Faites revivre trente îles endormies, une tuile à la fois, au fil des saisons.">
  <!-- la feuille reste l'icône d'onglet (lisible à 16 px) ; l'île sert dès qu'on a la place (favori, écran d'accueil) -->
  <link rel="icon" href="assets/img/ui/icon_leaf.png" type="image/png" sizes="100x100">
  <link rel="icon" href="assets/img/ui/app_icon_192.png" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="hud" class="screen" aria-live="polite"></div>
      <div id="tutorial" class="screen"></div>
      <div id="ui" class="screen"></div>
      <div id="fade"></div>
    </div>
    <!-- L'ouverture : l'animation du studio (4 s), par-dessus l'écran de chargement, qui charge pendant ce temps.
         Deux encodages du même film : WebM (VP9 + Opus, libre) d'abord, MP4 (H.264 + AAC) pour Safari. -->
    <div id="intro" hidden>
      <video id="intro-video" playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-label="Martinus Games">
        <source src="assets/video/intro.webm" type="video/webm">
        <source src="assets/video/intro.mp4" type="video/mp4">
      </video>
      <div class="intro-passer">Toucher pour passer</div>
    </div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">Cent Saisons</div>
        <div class="boot-sub">L’île qui se souvient</div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
        <div class="boot-status" id="boot-status">L’île s’éveille…</div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
